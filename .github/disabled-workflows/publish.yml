name: Publish

# Release = push a tag named mc-<minecraft_version>-v<mod_version> on the commit you want to ship,
# e.g. `git tag mc-1.20.4-v1.0.1 && git push origin mc-1.20.4-v1.0.1` from main.
# The tag decides the commit (and so the branch); everything else is read from that commit:
# Minecraft and mod versions from gradle.properties, Java version from build.gradle.
# Each tag publishes one version per loader on Modrinth and CurseForge (Forge, Fabric, and
# NeoForge where gradle.properties names a neoforge_version), and one GitHub release holding
# every jar. The 1.20.1 Forge jar is also listed for NeoForge, whose 1.20.1 is a Forge fork
# that loads it as is. Tags from before the Fabric port (no fabric/ module)
# publish their single Forge jar from build/libs, as they did then.
#
# Manual run (Actions > Publish > Run workflow, or `gh workflow run publish.yml --ref main -f tag=...`):
# publishes an existing tag again, only to the platforms ticked. Use it to add a platform that was
# skipped or failed, without uploading a duplicate to the others.
#
# Discord: the 1.21.1 tag also posts the changelog to the Discord server, through the webhook in the
# DISCORD_WEBHOOK_URL secret. A release pushes one tag per Minecraft version, so only one tag posts.
# A manual run posts only when "Post to Discord" is ticked.
on:
  push:
    tags: ['mc-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. mc-1.20.4-v1.1.0'
        required: true
        type: string
      modrinth:
        description: 'Publish to Modrinth'
        type: boolean
        default: false
      curseforge:
        description: 'Publish to CurseForge'
        type: boolean
        default: false
      github:
        description: 'Upload to the GitHub release'
        type: boolean
        default: false
      loader:
        description: 'Which jar to publish (tags from before the Fabric port only have Forge)'
        type: choice
        options: [all, forge, fabric, neoforge]
        default: all
      discord:
        description: 'Post the changelog to Discord'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The tag being published: the pushed one, or the one picked for a manual run.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Read versions
        id: props
        run: |
          mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          mod=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          java=$(grep -o 'JavaLanguageVersion.of([0-9]*)' build.gradle | grep -o '[0-9]\+')
          expected="mc-${mc}-v${mod}"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match gradle.properties of this commit (expected $expected). Wrong branch, or mod_version not bumped?"
            exit 1
          fi
          echo "mc=$mc" >> "$GITHUB_OUTPUT"
          echo "mod=$mod" >> "$GITHUB_OUTPUT"
          echo "java=$java" >> "$GITHUB_OUTPUT"
          # NeoForge jar only where gradle.properties names a version (settings.gradle builds it then).
          if grep -q '^neoforge_version=' gradle.properties; then
            echo "neoforge=true" >> "$GITHUB_OUTPUT"
          else
            echo "neoforge=false" >> "$GITHUB_OUTPUT"
          fi
          # One loader per line, the list form mc-publish documents.
          if [ "$mc" = 1.20.1 ]; then
            printf 'forge_loaders<<EOF\nforge\nneoforge\nEOF\n' >> "$GITHUB_OUTPUT"
          else
            echo "forge_loaders=forge" >> "$GITHUB_OUTPUT"
          fi
          if [ -d fabric ]; then
            echo "fabric=true" >> "$GITHUB_OUTPUT"
            echo "forge_files=forge/build/libs/!(*-@(dev|sources|javadoc)).jar" >> "$GITHUB_OUTPUT"
            echo "forge_label=Forge " >> "$GITHUB_OUTPUT"
          else
            echo "fabric=false" >> "$GITHUB_OUTPUT"
            echo "forge_files=build/libs/!(*-@(dev|sources|javadoc)).jar" >> "$GITHUB_OUTPUT"
            echo "forge_label=" >> "$GITHUB_OUTPUT"
          fi

      # The "## [<mod_version>]" section of CHANGELOG.md becomes the changelog on Modrinth,
      # CurseForge and the GitHub release. No section, no release: fail before building.
      - name: Extract changelog
        id: changelog
        env:
          MOD: ${{ steps.props.outputs.mod }}
        run: |
          awk -v v="$MOD" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-changelog.md
          if ! grep -q '[^[:space:]]' release-changelog.md; then
            echo "::error::CHANGELOG.md has no non-empty '## [$MOD]' section. Rename [Unreleased] to [$MOD] before tagging."
            exit 1
          fi
          cat release-changelog.md

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.props.outputs.java }}

      - name: Build
        id: build
        run: chmod +x gradlew && ./gradlew build

      # The jar checks of the verify-loaders skill (mixins, refmap, data folders, no test class shipped).
      # A tag from before the skill or before the Fabric port has no jarcheck.py: it publishes as before.
      - name: Check the jars
        id: jars
        run: |
          if [ -f .claude/skills/verify-loaders/scripts/jarcheck.py ] && [ -d fabric ]; then
            python3 -I .claude/skills/verify-loaders/scripts/jarcheck.py "$GITHUB_WORKSPACE" "${{ steps.props.outputs.mc }}" "$JAVA_HOME"
          else
            echo "No jarcheck.py in this tag: skipped."
          fi

      # A platform with an empty token is skipped by mc-publish: a tag push sends every token,
      # a manual run only the ticked ones. github.event.inputs is always a string (empty on a
      # push), so the comparisons never mistake a "false" for true.
      # Modrinth goes first. A refused Modrinth token must not stop CurseForge and GitHub, so a failed
      # Modrinth upload is skipped. Look for "Successfully published the assets to" in the log after each run.
      - name: Publish Forge
        if: github.event_name == 'push' || github.event.inputs.loader == 'all' || github.event.inputs.loader == 'forge'
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: dc7VO9FK
          modrinth-token: ${{ (github.event_name == 'push' || github.event.inputs.modrinth == 'true') && secrets.MODRINTH_TOKEN || '' }}
          modrinth-fail-mode: skip
          curseforge-id: 982343
          curseforge-token: ${{ (github.event_name == 'push' || github.event.inputs.curseforge == 'true') && secrets.CURSEFORGE_TOKEN || '' }}
          github-token: ${{ (github.event_name == 'push' || github.event.inputs.github == 'true') && secrets.GITHUB_TOKEN || '' }}
          github-tag: ${{ env.TAG }}
          changelog-file: release-changelog.md
          files: ${{ steps.props.outputs.forge_files }}
          name: Balanced Minecraft Hardcore ${{ steps.props.outputs.mod }} for ${{ steps.props.outputs.forge_label }}${{ steps.props.outputs.mc }}
          github-name: Balanced Minecraft Hardcore ${{ steps.props.outputs.mod }} for ${{ steps.props.outputs.mc }}
          version: ${{ steps.props.outputs.mc }}-${{ steps.props.outputs.mod }}
          version-type: release
          loaders: ${{ steps.props.outputs.forge_loaders }}
          game-versions: ${{ steps.props.outputs.mc }}
          java: ${{ steps.props.outputs.java }}

      # Adds its jar to the GitHub release the Forge step created. Runs even if the Forge step
      # failed (!cancelled() replaces the implicit success()), so one loader never blocks the other.
      - name: Publish Fabric
        if: >-
          !cancelled() && steps.build.outcome == 'success' && steps.jars.outcome == 'success' && steps.props.outputs.fabric == 'true'
          && (github.event_name == 'push' || github.event.inputs.loader == 'all' || github.event.inputs.loader == 'fabric')
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: dc7VO9FK
          modrinth-token: ${{ (github.event_name == 'push' || github.event.inputs.modrinth == 'true') && secrets.MODRINTH_TOKEN || '' }}
          modrinth-fail-mode: skip
          curseforge-id: 982343
          curseforge-token: ${{ (github.event_name == 'push' || github.event.inputs.curseforge == 'true') && secrets.CURSEFORGE_TOKEN || '' }}
          github-token: ${{ (github.event_name == 'push' || github.event.inputs.github == 'true') && secrets.GITHUB_TOKEN || '' }}
          github-tag: ${{ env.TAG }}
          changelog-file: release-changelog.md
          files: fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
          name: Balanced Minecraft Hardcore ${{ steps.props.outputs.mod }} for Fabric ${{ steps.props.outputs.mc }}
          github-name: Balanced Minecraft Hardcore ${{ steps.props.outputs.mod }} for ${{ steps.props.outputs.mc }}
          version: ${{ steps.props.outputs.mc }}-${{ steps.props.outputs.mod }}-fabric
          version-type: release
          loaders: fabric
          game-versions: ${{ steps.props.outputs.mc }}
          dependencies: fabric-api(required)
          java: ${{ steps.props.outputs.java }}

      # Same as Fabric: runs even if another loader's step failed.
      - name: Publish NeoForge
        if: >-
          !cancelled() && steps.build.outcome == 'success' && steps.jars.outcome == 'success' && steps.props.outputs.neoforge == 'true'
          && (github.event_name == 'push' || github.event.inputs.loader == 'all' || github.event.inputs.loader == 'neoforge')
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: dc7VO9FK
          modrinth-token: ${{ (github.event_name == 'push' || github.event.inputs.modrinth == 'true') && secrets.MODRINTH_TOKEN || '' }}
          modrinth-fail-mode: skip
          curseforge-id: 982343
          curseforge-token: ${{ (github.event_name == 'push' || github.event.inputs.curseforge == 'true') && secrets.CURSEFORGE_TOKEN || '' }}
          github-token: ${{ (github.event_name == 'push' || github.event.inputs.github == 'true') && secrets.GITHUB_TOKEN || '' }}
          github-tag: ${{ env.TAG }}
          changelog-file: release-changelog.md
          files: neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar
          name: Balanced Minecraft Hardcore ${{ steps.props.outputs.mod }} for NeoForge ${{ steps.props.outputs.mc }}
          github-name: Balanced Minecraft Hardcore ${{ steps.props.outputs.mod }} for ${{ steps.props.outputs.mc }}
          version: ${{ steps.props.outputs.mc }}-${{ steps.props.outputs.mod }}-neoforge
          version-type: release
          loaders: neoforge
          game-versions: ${{ steps.props.outputs.mc }}
          java: ${{ steps.props.outputs.java }}

      # A tag push posts when the build succeeded, even if an upload failed: a refused Modrinth
      # token makes every publish step end red, also when CurseForge and GitHub got the jars.
      # A manual run with "Post to Discord" ticked needs only the changelog.
      # Only the 1.21.1 tag posts. When you add a newer version branch, move the post to its tag.
      # The embed description holds at most 4096 characters. A longer changelog is cut, with a
      # link to the GitHub releases. Headings become bold text, which every Discord client shows.
      - name: Post to Discord
        if: >-
          !cancelled() && (
            (github.event_name == 'push' && steps.build.outcome == 'success' && steps.jars.outcome == 'success' && steps.props.outputs.mc == '1.21.1')
            || (steps.changelog.outcome == 'success' && github.event.inputs.discord == 'true'))
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MOD: ${{ steps.props.outputs.mod }}
          RELEASES: ${{ github.server_url }}/${{ github.repository }}/releases
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::The DISCORD_WEBHOOK_URL secret is not set. Nothing was posted to Discord."
            exit 0
          fi
          # An image line of the changelog would show as raw text in the embed: the first image becomes the
          # embed's picture (Discord animates a GIF there), and every image line leaves the text.
          image=$(grep -o -m1 '^!\[[^]]*\]([^)]*)' release-changelog.md | sed -E 's/.*\(([^)]*)\)$/\1/')
          sed -E '/^!\[/d; s/^#+[[:space:]]+(.*)$/**\1**/' release-changelog.md | cat -s | jq -Rs \
            --arg mod "$MOD" --arg releases "$RELEASES" --arg image "$image" '
            (gsub("^\\s+|\\s+$"; "")) as $log
            | "\n\n[Full changelog](\($releases))" as $more
            | {
                allowed_mentions: { parse: [] },
                embeds: [{
                  title: "Balanced Minecraft Hardcore \($mod)",
                  url: "https://www.curseforge.com/minecraft/mc-mods/balanced-minecraft-hardcore",
                  color: 9330905,
                  description: (if ($log | length) > 3900 then $log[:3900] + "..." + $more else $log end),
                  fields: [{
                    name: "Download",
                    value: "[CurseForge](https://www.curseforge.com/minecraft/mc-mods/balanced-minecraft-hardcore/files) | [GitHub](\($releases))"
                  }]
                } + (if $image == "" then {} else { image: { url: $image } } end)]
              }' > discord-payload.json
          curl --fail-with-body -sS -H 'Content-Type: application/json' --data @discord-payload.json "$DISCORD_WEBHOOK_URL"
          echo "Posted the $MOD changelog to Discord."
