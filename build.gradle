// Shared by the common, forge, fabric and neoforge modules.
// Every plugin is declared here once, so that they all share one classloader.
plugins {
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)' apply false
    id 'org.spongepowered.mixin' version '0.7.+' apply false
    id 'fabric-loom' version '1.7.4' apply false
    id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

subprojects {
    apply plugin: 'java'

    version = mod_version
    group = mod_group_id

    // Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
    java.toolchain.languageVersion = JavaLanguageVersion.of(17)

    repositories {
        mavenCentral()
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    }
}

// The loaders compile common's sources and resources themselves, so that each loader's
// mixin processor writes the refmap for the common mixins too.
configure(subprojects - project(':common')) {
    evaluationDependsOn(':common')

    tasks.named('compileJava', JavaCompile) {
        source(project(':common').sourceSets.main.java)
    }

    tasks.named('processResources', ProcessResources) {
        from(project(':common').sourceSets.main.resources)
    }
}
