// Shared by the common, forge, fabric and neoforge modules.
// Every plugin is declared here once, so that they all share one classloader.
plugins {
    id 'net.minecraftforge.gradle' version '7.0.40' apply false
    id 'net.fabricmc.fabric-loom' version '1.15.5' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

subprojects {
    apply plugin: 'java'

    version = mod_version
    group = mod_group_id

    // Minecraft 26.1 runs on Java 25.
    java.toolchain.languageVersion = JavaLanguageVersion.of(25)

    repositories {
        mavenCentral()
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    }
}

// The loaders compile common's sources and resources themselves, so that each loader jar holds them.
configure([project(':forge'), project(':fabric'), project(':neoforge')]) {
    evaluationDependsOn(':common')

    tasks.named('compileJava', JavaCompile) {
        source(project(':common').sourceSets.main.java)
    }

    tasks.named('processResources', ProcessResources) {
        from(project(':common').sourceSets.main.resources)
    }
}
