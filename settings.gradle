pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'bmh'

// common: loader-independent code, compiled into every jar. forge, fabric and neoforge: one jar each.
include 'common', 'forge', 'fabric'
// NeoForge only where gradle.properties names a version: 1.20.4 (NeoForge starts at 1.20.2, and the
// 1.20.2 and 1.20.3 lines died young). Elsewhere neoforge/ sits in the tree, unbuilt.
if (providers.gradleProperty('neoforge_version').isPresent()) {
    include 'neoforge'
}
