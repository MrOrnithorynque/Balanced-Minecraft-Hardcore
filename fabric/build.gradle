plugins {
    id 'fabric-loom'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

loom {
    mixin {
        defaultRefmapName = "${mod_id}.refmap.json"
    }

    runs {
        configureEach {
            runDir 'run'
        }
    }
}

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Same Mojang names as the forge module, so common code reads the same on both loaders.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // javax.annotation.Nonnull, used by common code; Forge and vanilla bring it along, Fabric does not.
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    // The Config button in Mod Menu. Players do not need Mod Menu: only Mod Menu loads the entrypoint.
    // The dev runs (runClient) get it too, so the button can be tested there.
    modCompileOnly("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
    modLocalRuntime("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, fabric_loader_version: fabric_loader_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}
