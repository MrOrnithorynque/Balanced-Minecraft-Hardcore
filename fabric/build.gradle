plugins {
    id 'net.fabricmc.fabric-loom'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

loom {
    runs {
        configureEach {
            runDir 'run'
        }
    }
}

repositories {
    // Fabric API only from Fabric's maven: the Sponge proxy (root build.gradle) serves stale poms of it,
    // e.g. a 1.21.1 fabric-loot-api-v2 that pulls 1.21.2 modules into the dev runtime and crashes it.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Fabric'
                url = 'https://maven.fabricmc.net/'
            }
        }
        filter {
            includeGroup('net.fabricmc.fabric-api')
        }
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    // Minecraft 26.1 ships unobfuscated: no mappings, no remapping, no refmap.
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // The Config button in Mod Menu. Players do not need Mod Menu: only Mod Menu loads the entrypoint.
    // The dev runs (runClient) get it too, so the button can be tested there.
    compileOnly("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
    localRuntime("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, fabric_loader_version: fabric_loader_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}
