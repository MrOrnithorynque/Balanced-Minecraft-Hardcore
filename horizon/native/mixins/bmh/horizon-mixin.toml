# Balanced Minecraft Hardcore on Horizon: the native part (docs/horizon/ARCHITECTURE.md).
# Every hook is named by its target path (decision D3). docs/horizon/HOOKS.md lists them.
[mod]
id = "bmh"
version = "1.9.0"
priority = 100

# The Nightly of 2026-11-08 (decision D1): it compiles the pending hooks that BMH needs.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# The pure logic, with its unit tests (cargo test in horizon/native).
[[crate]]
id = "logic"
path = "logic"

# One module per area, plus `bmh` (ids and the Options > Mods row).
[[module]]
id = "bmh"
file = "crates/horizon-client/src/game.rs"
name = "bmh"
source = "bmh.rs"

