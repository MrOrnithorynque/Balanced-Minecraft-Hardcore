// Compiled against vanilla Minecraft only (NeoForm, no loader): anything loader-specific in here fails this build.
plugins {
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
}

dependencies {
    // Forge, Fabric and NeoForge all ship Mixin 0.8.7.
    compileOnly 'org.spongepowered:mixin:0.8.7'
}
